openapi: 3.0.0
info:
  title: TMI 작성자 추리 투표 및 점수 저장 API 문서
  description: TMI 작성자 추리 투표 및 점수 저장 기능을 제공하는 RESTful API 명세서
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /tmi/{tmiId}/guess:
    post:
      summary: TMI 작성자 추리 투표 및 점수 저장
      description: >-
        TMI ID로 작성자를 추리하고 채점합니다.
        정답(작성자)은 제출 후 응답으로 공개되며, 작성자를 맞힌 경우에만 10점이 누적됩니다.
        같은 TMI에는 한 번만 투표할 수 있고, 본인이 작성한 TMI에는 투표할 수 없으며,
        작성자와 같은 방에 속한 멤버만 투표할 수 있습니다.
      tags:
        - Tmi
      security:
        - BearerAuth: []
      parameters:
        - name: tmiId
          in: path
          required: true
          description: 추리 대상 TMI의 ID
          schema:
            type: integer
            format: int64
            example: 1234
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TmiGuessRequest'
      responses:
        '200':
          description: TMI 작성자 추리 투표 제출 및 채점 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmiGuessResponse'
        '400':
          description: 필수 값 누락, 본인 TMI 투표, 같은 방 멤버가 아님, 이미 투표함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ValidationError:
                  summary: 필수 값 누락
                  value:
                    status: 400
                    error: "Bad Request"
                    message: "입력값이 올바르지 않습니다."
                    details:
                      - field: "guessedUserId"
                        reason: "추리 대상 사용자 ID는 필수 입력값입니다."
                OwnTmi:
                  summary: 본인이 작성한 TMI
                  value:
                    status: 400
                    error: "Bad Request"
                    message: "본인이 작성한 TMI에는 투표할 수 없습니다."
                NotSameRoom:
                  summary: 작성자와 같은 방이 아님
                  value:
                    status: 400
                    error: "Bad Request"
                    message: "같은 방의 멤버가 작성한 TMI만 투표할 수 있습니다."
                AlreadyGuessed:
                  summary: 이미 투표한 TMI
                  value:
                    status: 400
                    error: "Bad Request"
                    message: "이미 투표한 TMI입니다."
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "유효하지 않은 토큰입니다."
        '404':
          description: TMI 미존재
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFound:
                  value:
                    status: 404
                    error: "Not Found"
                    message: "해당 TMI을 찾을 수 없습니다."

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TmiGuessRequest:
      type: object
      required:
        - guessedUserId
      properties:
        guessedUserId:
          type: integer
          format: int64
          example: 42
          description: 내가 추리한 작성자의 고유 사용자 ID (방 멤버 목록 조회의 userId)

    TmiGuessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "채점 완료"
        data:
          type: object
          properties:
            isCorrect:
              type: boolean
              example: true
              description: 작성자를 맞혔는지 여부
            actualAuthorName:
              type: string
              example: "홍길동"
              description: 실제 TMI 작성자 이름 (제출 후 공개)
            accumulatedScore:
              type: integer
              example: 10
              description: 현재까지 누적된 내 점수 (작성자를 맞힌 경우에만 +10)

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "에러에 대한 상세 메시지"
        details:
          type: array
          description: 유효성 검사 실패 상세 목록
          items:
            type: object
            properties:
              field:
                type: string
                example: "guessedUserId"
              reason:
                type: string
                example: "추리 대상 사용자 ID는 필수 입력값입니다."