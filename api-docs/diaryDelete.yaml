openapi: 3.0.0
info:
  title: 일기 삭제 API 문서
  description: 일기 삭제 기능을 제공하는 RESTful API 명세서
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /diaries/{diaryId}:
    delete:
      summary: 일기 삭제
      description: 일기 ID를 통해 일기 삭제
      tags:
        - Diary
      security:
        - BearerAuth: []
      parameters:
        - name: diaryId
          in: path
          required: true
          description: 조회할 일기 고유 ID
          schema:
            type: integer
            example: 1001
      responses:
        '200':
          description: 일기 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryDeleteResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "유효하지 않은 토큰입니다"        
        '404':
          description: 일기 미존재
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFound:
                  value:
                    status: 404
                    error: "Not Found"
                    message: "해당 일기를 찾을 수 없습니다."

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:    
    DiaryDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "일기 삭제 성공"
        data:
          type: object
          nullable: true
          example: null

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 401
        error:
          type: string
          example: "Unauthorized"
        message:
          type: string
          example: "인증 실패"
        details:
          type: array
          description: "유효성 검사 실패"
          items:
            type: object
            properties:
              field:
                type: string
                example: "password"
              reason:
                type: string
                example: "비밀번호는 8자 이상이어야 합니다."
          example: "인증 실패"