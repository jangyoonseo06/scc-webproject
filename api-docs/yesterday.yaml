openapi: 3.0.0
info:
  title: 어제의 우리 기능 API 문서
  description: 어제의 우리 기능을 제공하는 RESTful API 명세서
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /rooms/{roomId}/diaries/yesterday:
    get:
      summary: 어제의 우리 기능
      description: 방 ID를 통해 방 멤버들의 어제 일기 목록을 조회합니다. 임시저장 일기는 제외되며 최신순으로 반환됩니다. 해당 방의 멤버만 조회할 수 있습니다.
      tags:
        - Diary
      security:
        - BearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          description: 방 ID
          schema:
            type: integer
            format: int64
            example: 1234
      responses:
        '200':
          description: 어제의 일기 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YesterdayDiaryResponse'
        '400':
          description: 해당 방의 멤버가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotMember:
                  value:
                    status: 400
                    error: "Bad Request"
                    message: "해당 방의 접근 권한이 없습니다."
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "유효하지 않은 토큰입니다."
        '404':
          description: 방 미존재
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFound:
                  value:
                    status: 404
                    error: "Not Found"
                    message: "해당 방을 찾을 수 없습니다."

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    YesterdayDiaryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "어제의 일기 조회 성공"
        data:
          type: object
          properties:
            diaries:
              type: array
              description: 방 멤버들의 어제 일기 목록
              items:
                type: object
                properties:
                  diaryId:
                    type: integer
                    format: int64
                    description: 일기의 고유 ID
                    example: 1001
                  date:
                    type: string
                    description: 일기 작성 날짜
                    example: "2026-10-06"
                  content:
                    type: string
                    description: 일기 내용
                    example: "오늘 무엇을 했다"
                  emotion:
                    type: string
                    description: 오늘의 감정
                    example: "HAPPY"
                  authorName:
                    type: string
                    description: 일기 작성자 이름
                    example: "홍길동"

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 404
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "해당 방을 찾을 수 없습니다."