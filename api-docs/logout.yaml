openapi: 3.0.0
info:
  title: 로그아웃 API 문서
  description: 사용자의 로그아웃 기능을 제공하는 RESTful API 명세입니다.
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /auth/logout:
    post:
      summary: 로그아웃
      description: 요청 body의 refreshToken을 삭제하여 로그아웃 처리를 수행합니다. 이미 발급된 accessToken은 만료 시간(1시간)까지 유효합니다.
      tags:
        - Authentication
      requestBody:
        required: true
        description: 로그인 시 발급받은 refreshToken
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '400':
          description: 잘못된 요청 (refreshToken 누락)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ValidationError:
                  value:
                    status: 400
                    error: "Bad Request"
                    message: "입력값이 올바르지 않습니다."
                    details:
                      - field: "refreshToken"
                        reason: "refreshToken은 필수 입력값입니다."
        '401':
          description: 유효하지 않은 refreshToken (이미 로그아웃했거나 존재하지 않는 토큰)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "유효하지 않은 토큰입니다"

components:
  schemas:
    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: 로그인 시 발급받은 refreshToken
          example: "eyJhbGciOiJIUzI1NiJ9..."

    LogoutResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "로그아웃이 성공적으로 완료되었습니다."
        data:
          type: object
          nullable: true
          example: null

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 401
        error:
          type: string
          example: "Unauthorized"
        message:
          type: string
          example: "유효하지 않은 토큰입니다"
        details:
          type: array
          description: 유효성 검사 실패 상세 목록
          items:
            type: object
            properties:
              field:
                type: string
                example: "refreshToken"
              reason:
                type: string
                example: "refreshToken은 필수 입력값입니다."