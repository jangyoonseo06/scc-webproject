openapi: 3.0.0
info:
  title: TMI 작성 기능 API 문서
  description: 익명 MI 작성 및 거짓 TMI 기능을 제공하는 RESTful API 명세서
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /tmi:
    post:
      summary: TMI 작성 기능
      description: 익명 TMI 작성 및 거짓 TMI 기능
      tags:
        - Tmi
      security:
        - BearerAuth: []
      requestBody: 
        required: true
        description: 작성할 TMI 내용
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TmiRequest'
      responses:
        '201':
          description: TMI 작성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmiResponse'
        '400':
          description: 잘못된 요청 (필수 값 누락)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ValidationError:
                  value:
                    status: 400
                    error: "Bad Request"
                    message: "입력값이 올바르지 않습니다."
                    details:
                      - field: "content"
                        reason: "내용은 필수 입력값입니다."
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "유효하지 않은 토큰입니다"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TmiRequest:
      type: object
      required:
        - content
        - isFake
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000
          example: "오늘은 무엇을 했다"
          description: TMI 내용 작성
        isFake:
          type: boolean
          example: true
          description: TMI의 진위 여부
    TmiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "tmi 작성 성공"
        data:
          type: object
          properties:
            tmiId:
              type: integer
              description: tmi의 고유 ID
              example: 1001
            content:
              type: string
              example: "오늘은 무엇을 했다"
              description: TMI 내용 작성
            isFake:
              type: boolean
              example: true
              description: TMI의 진위 여부
            

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 401
        error:
          type: string
          example: "Unauthorized"
        message:
          type: string
          example: "인증 실패"
        details:
          type: array
          description: "유효성 검사 실패"
          items:
            type: object
            properties:
              field:
                type: string
                example: "password"
              reason:
                type: string
                example: "비밀번호는 8자 이상이어야 합니다."
          example: "인증 실패"