openapi: 3.0.0
info:
  title: 내가 쓴 일기 목록 조회 API 문서
  description: 로그인한 사용자가 작성한 일기 목록과 개수를 조회하는 RESTful API 명세서
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /diaries/me:
    get:
      summary: 내가 쓴 일기 목록 조회
      description: >-
        Authorization 헤더의 토큰으로 식별한 로그인 사용자가 작성한 일기를 작성 날짜 최신순으로 조회합니다.
        isTemporary를 생략하면 임시저장을 포함한 전체, true이면 임시저장만, false이면 작성 완료한 일기만 반환합니다.
        totalCount는 반환된 목록의 개수입니다.
      tags:
        - Diary
      security:
        - BearerAuth: []
      parameters:
        - name: isTemporary
          in: query
          required: false
          description: 임시저장 여부 필터 (생략 시 전체, true 임시저장만, false 작성 완료만)
          schema:
            type: boolean
            example: false
      responses:
        '200':
          description: 내 일기 목록 조회 성공 (일기가 없으면 totalCount 0, diaries는 빈 배열)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyDiaryListResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "유효하지 않은 토큰입니다"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MyDiaryListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "내 일기 목록 조회 성공"
        data:
          type: object
          properties:
            totalCount:
              type: integer
              description: 반환된 일기 개수
              example: 2
            diaries:
              type: array
              description: 내가 쓴 일기 목록 (작성 날짜 최신순)
              items:
                type: object
                properties:
                  diaryId:
                    type: integer
                    format: int64
                    description: 일기의 고유 ID (단건 조회 GET /diaries/{diaryId}에 사용)
                    example: 1001
                  date:
                    type: string
                    format: date
                    description: 일기 날짜
                    example: "2026-11-17"
                  content:
                    type: string
                    description: 일기 내용
                    example: "오늘은 무엇을 했다"
                  questionToFriend:
                    type: string
                    description: 친구에게 한 질문
                    example: "너는 오늘 뭐 했어?"
                  emotion:
                    type: string
                    enum: [HAPPY, CALM, NORMAL, UPSET, TIRED, EXCITED]
                    description: 오늘의 감정
                    example: "HAPPY"
                  isTemporary:
                    type: boolean
                    description: 임시저장 여부 (true 임시저장, false 작성 완료)
                    example: false

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 401
        error:
          type: string
          example: "Unauthorized"
        message:
          type: string
          example: "유효하지 않은 토큰입니다"
