openapi: 3.0.0
info:
  title: 회원가입 API 문서
  description: 사용자의 회원가입 기능을 제공하는 RESTful API 명세입니다.
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /auth/signup:
    post:
      summary: 회원가입
      description: 새로운 사용자의 정보를 받아 회원가입을 처리
      tags:
        - Authentication
      requestBody:
        required: true
        description: 가입할 사용자의 계정 정보
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          description: 잘못된 요청 (비밀번호 형식 오류, 필수 값 누락 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ValidationError:
                  summary: 유효성 검사 실패 예시
                  value:
                    status: 400
                    error: "Bad Request"
                    message: "입력값이 올바르지 않습니다."
                    details:
                      - field: "password"
                        reason: "비밀번호는 영문, 숫자, 특수문자를 포함해 8자 이상이어야 합니다"
        '409':
          description: 이미 존재하는 이메일 (중복 회원가입 불가)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ConflictError:
                  summary: 이메일 중복 예시
                  value:
                    status: 409
                    error: "Conflict"
                    message: "이미 존재하는 이메일입니다."

components:
  schemas:
    SignupRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
          description: 사용자 이메일 (로그인 ID로 사용)
        password:
          type: string
          format: password
          example: "Password123!"
          minLength: 8
          description: 비밀번호 (영문, 숫자, 특수문자 조합 8자리 이상)
        name:
          type: string
          example: "홍길동"
          description: 사용자 이름
          minLength: 2
          maxLength: 10

    SignupResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "회원가입이 성공적으로 완료되었습니다."
        data:
          type: object
          properties:
            userId:
              type: integer
              example: 1042
            email:
              type: string
              example: "user@example.com"

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "에러에 대한 상세 메시지"
        details:
          type: array
          description: "유효성 검사 실패"
          items:
            type: object
            properties:
              field:
                type: string
                example: "password"
              reason:
                type: string
                example: "비밀번호는 8자 이상이어야 합니다."