openapi: 3.0.0
info:
  title: 방 멤버들의 TMI 목록 조회 API 문서
  description: 방 멤버들의 TMI 목록 조회 기능을 제공하는 RESTful API 명세서
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /rooms/{roomId}/tmi:
    get:
      summary: 방 멤버들의 TMI 목록 조회
      description: >-
        방 ID를 통해 방 멤버들의 TMI 목록을 최신순으로 조회합니다.
        TMI는 익명으로 제공되며 작성자와 거짓 여부(isFake)는 응답에 포함되지 않습니다.
        해당 방의 멤버만 조회할 수 있습니다.
      tags:
        - Tmi
      security:
        - BearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          description: 방 ID
          schema:
            type: integer
            format: int64
            example: 1234
      responses:
        '200':
          description: TMI 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmiReadResponse'
        '400':
          description: 해당 방의 멤버가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotMember:
                  value:
                    status: 400
                    error: "Bad Request"
                    message: "해당 방의 접근 권한이 없습니다."
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "유효하지 않은 토큰입니다."
        '404':
          description: 방 미존재
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFound:
                  value:
                    status: 404
                    error: "Not Found"
                    message: "해당 방을 찾을 수 없습니다."

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TmiReadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "tmi 목록 조회 성공"
        data:
          type: object
          properties:
            tmis:
              type: array
              description: 방 멤버들의 TMI 목록 (최신순)
              items:
                type: object
                properties:
                  tmiId:
                    type: integer
                    format: int64
                    description: TMI의 고유 ID
                    example: 1001
                  content:
                    type: string
                    description: TMI 내용
                    example: "오늘은 무엇을 했다"
                  isMine:
                    type: boolean
                    description: 내가 작성한 TMI인지 여부 (true이면 추리 투표 불가)
                    example: false
                  hasGuessed:
                    type: boolean
                    description: 내가 이미 투표한 TMI인지 여부
                    example: false

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "에러에 대한 상세 메시지"
        details:
          type: array
          description: 유효성 검사 실패 상세 목록
          items:
            type: object
            properties:
              field:
                type: string
                example: "roomId"
              reason:
                type: string
                example: "올바르지 않은 값입니다."