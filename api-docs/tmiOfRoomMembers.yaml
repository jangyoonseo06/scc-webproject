openapi: 3.0.0
info:
  title: 방 멤버들의 tmi 목록 조회 API 문서
  description: 방 멤버들의 tmi 목록 조회 기능을 제공하는 RESTful API 명세서
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /rooms/{roomId}/tmi:
    get:
      summary: 방 멤버들의 tmi 목록 조회
      description: 방 ID를 통해 방 멤버들의 tmi 목록 조회
      tags:
        - Tmi
      security:
        - BearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          description: 방 ID
          schema:
            type: integer
            example: 1234
      responses:
        '200':
          description: TMI 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmiReadResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "유효하지 않은 토큰입니다."
        '404':
          description: 방 미존재
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFound:
                  value:
                    status: 404
                    error: "NotFound"
                    message: "해당 방을 찾을 수 없습니다."

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TmiReadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "tmi 작성 성공"
        data:
          type: object
          properties:
            tmis:
              type: array
              description: 방 멤버들의 tmi 목록 조회
              items:
                type: object
                properties:
                  tmiId:
                    type: integer
                    description: tmi의 고유 ID
                    example: 1001
                  content:
                    type: string
                    example: "오늘은 무엇을 했다"
                    description: TMI 내용 작성
                  isFake:
                    type: boolean
                    example: true
                    description: TMI의 진위 여부
            

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 401
        error:
          type: string
          example: "Unauthorized"
        message:
          type: string
          example: "인증 실패"
        details:
          type: array
          description: "유효성 검사 실패"
          items:
            type: object
            properties:
              field:
                type: string
                example: "password"
              reason:
                type: string
                example: "비밀번호는 8자 이상이어야 합니다."
          example: "인증 실패"
