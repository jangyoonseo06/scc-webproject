openapi: 3.0.0
info:
  title: 방 멤버 목록 조회 API 문서
  description: 방 멤버 목록 조회 기능을 제공하는 RESTful API 명세서
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /rooms/{roomId}/members:
    get:
      summary: 방 멤버 목록 조회
      description: 방 ID를 통해 방 멤버 목록(사용자 ID, 이름)을 조회합니다. 해당 방의 멤버만 조회할 수 있습니다.
      tags:
        - Room
      security:
        - BearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          description: 방 고유 ID
          schema:
            type: integer
            format: int64
            example: 1234
      responses:
        '200':
          description: 방 멤버 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersResponse'
        '400':
          description: 해당 방의 멤버가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotMember:
                  value:
                    status: 400
                    error: "Bad Request"
                    message: "방 멤버만 조회할 수 있습니다"
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "유효하지 않은 토큰입니다"
        '404':
          description: 방 미존재
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFound:
                  value:
                    status: 404
                    error: "Not Found"
                    message: "해당 방을 찾을 수 없습니다"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MembersResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "방 멤버 목록 조회 성공"
        data:
          type: object
          properties:
            members:
              type: array
              description: 방 멤버 목록
              items:
                type: object
                properties:
                  userId:
                    type: integer
                    format: int64
                    description: 사용자 고유 ID (TMI 추리 투표의 guessedUserId로 사용)
                    example: 1
                  name:
                    type: string
                    description: 사용자 이름
                    example: "홍길동"

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "에러에 대한 상세 메시지"
        details:
          type: array
          description: 유효성 검사 실패 상세 목록
          items:
            type: object
            properties:
              field:
                type: string
                example: "roomId"
              reason:
                type: string
                example: "올바르지 않은 값입니다."