openapi: 3.0.0
info:
  title: 일기 조회 및 다음 날 공개 API 문서
  description: 일기 조회 기능과 다음 날 공개 기능을 제공하는 RESTful API 명세서
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /diaries/{diaryId}:
    get:
      summary: 일기 조회
      description: 일기 ID를 통해 일기 조회 및 다음 날 공개 기능
      tags:
        - Diary
      security:
        - BearerAuth: []
      parameters:
        - name: diaryId
          in: path
          required: true
          description: 조회할 일기 고유 ID
          schema:
            type: integer
            example: 1001
      responses:
        '200':
          description: 일기 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryReadResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "유효하지 않은 토큰입니다"
        
        '403':
          description: 공개 시간 전 접근 차단
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Forbidden:
                  value:
                    status: 403
                    error: "Forbidden"
                    message: "아직 열리지 않은 일기입니다. 내일 확인해주세요."
        
        '404':
          description: 일기 미존재
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFound:
                  value:
                    status: 404
                    error: "Not Found"
                    message: "해당 일기를 찾을 수 없습니다."

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:    
    DiaryReadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "일기 조회 성공"
        data:
          type: object
          properties:
            diaryId:
              type: integer
              description: 수정된 일기의 고유 ID
              example: 1001
            date:
              type: string
              description: 일기 작성 날짜
              example: "2026-10-06"
            content:
              type: string
              description: 일기 내용
              example: "오늘 무엇을 했다"
            questionToFriend:
              type: string
              description: 친구에게 질문한 내용
              example: "너는 오늘 뭐 했어?"
            emotion:
              type: string
              description: 오늘의 감정
              example: "HAPPY"
            authorName:
              type: string
              description: 일기 작성자 이름
              example: "홍길동"

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 401
        error:
          type: string
          example: "Unauthorized"
        message:
          type: string
          example: "인증 실패"
        details:
          type: array
          description: "유효성 검사 실패"
          items:
            type: object
            properties:
              field:
                type: string
                example: "password"
              reason:
                type: string
                example: "비밀번호는 8자 이상이어야 합니다."
          example: "인증 실패"