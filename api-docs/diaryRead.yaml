openapi: 3.0.0
info:
  title: 일기 조회 및 다음 날 공개 API 문서
  description: 일기 조회 기능과 다음 날 공개 기능을 제공하는 RESTful API 명세서
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /diaries/{diaryId}:
    get:
      summary: 일기 조회
      description: >-
        일기 ID로 일기를 조회합니다.
        작성자 본인은 임시저장을 포함해 언제든 조회할 수 있습니다.
        다른 사람은 작성자와 같은 방의 멤버여야 하고, 임시저장이 아닌 일기를 작성일 다음 날부터 조회할 수 있습니다.
      tags:
        - Diary
      security:
        - BearerAuth: []
      parameters:
        - name: diaryId
          in: path
          required: true
          description: 조회할 일기 고유 ID
          schema:
            type: integer
            format: int64
            example: 1001
      responses:
        '200':
          description: 일기 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryReadResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "유효하지 않은 토큰입니다"
        '403':
          description: 공개 시간 전 접근 차단 (작성자가 아닌 사람이 임시저장 일기나 작성일 당일 일기를 조회)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Forbidden:
                  value:
                    status: 403
                    error: "Forbidden"
                    message: "아직 열리지 않은 일기입니다. 내일 확인해주세요."
        '404':
          description: 일기 미존재 또는 조회 권한 없음 (작성자와 같은 방이 아닌 경우에도 일기의 존재를 알리지 않기 위해 404로 응답)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFound:
                  value:
                    status: 404
                    error: "Not Found"
                    message: "해당 일기를 찾을 수 없습니다."

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DiaryReadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "일기 조회 성공"
        data:
          type: object
          properties:
            diaryId:
              type: integer
              format: int64
              description: 조회한 일기의 고유 ID
              example: 1001
            date:
              type: string
              description: 일기 작성 날짜
              example: "2026-10-06"
            content:
              type: string
              description: 일기 내용
              example: "오늘 무엇을 했다"
            questionToFriend:
              type: string
              description: 친구에게 질문한 내용
              example: "너는 오늘 뭐 했어?"
            emotion:
              type: string
              description: 오늘의 감정
              example: "HAPPY"
            authorName:
              type: string
              description: 일기 작성자 이름
              example: "홍길동"

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 403
        error:
          type: string
          example: "Forbidden"
        message:
          type: string
          example: "아직 열리지 않은 일기입니다. 내일 확인해주세요."