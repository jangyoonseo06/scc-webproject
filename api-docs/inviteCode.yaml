openapi: 3.0.0
info:
  title: 초대코드 조회 API 문서
  description: 초대코드 조회 기능을 제공하는 RESTful API 명세서
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /rooms/{roomId}/invite-code:
    get:
      summary: 초대코드 조회
      description: 방 ID를 기반으로 초대코드 조회
      tags:
        - Room
      security:
        - BearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          description: 방 고유 ID
          schema:
            type: integer
            example: 1234
      responses:
        '200':
          description: 초대코드 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCodeResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "유효하지 않은 토큰입니다"

        '404':
          description: 올바르지 않은 경로
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFound:
                  value:
                    status: 404
                    error: "Not Found"
                    message: "해당 방을 찾을 수 없습니다"


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    InviteCodeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "초대코드 조회 성공"
        data:
          type: object
          properties:
            inviteCode:
              type: string
              example: "ABC123"

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 401
        error:
          type: string
          example: "Unauthorized"
        message:
          type: string
          example: "인증 실패"
        details:
          type: array
          description: "유효성 검사 실패"
          items:
            type: object
            properties:
              field:
                type: string
                example: "password"
              reason:
                type: string
                example: "비밀번호는 8자 이상이어야 합니다."
          example: "인증 실패"