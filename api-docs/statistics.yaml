openapi: 3.0.0
info:
  title: TMI 통계 조회 API 문서
  description: 사용자별 TMI 작성자 추리 통계 조회 기능을 제공하는 RESTful API 명세서
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /tmi/statistics:
    get:
      summary: TMI 작성자 추리 통계 조회
      description: >-
        로그인한 사용자의 작성자 추리 정답률, 정답 횟수, 전체 추리 횟수를 조회합니다.
        추리 이력이 없으면 모든 값이 0으로 반환됩니다.
      tags:
        - Tmi
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 통계 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "유효하지 않은 토큰입니다."

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StatisticsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "통계 조회 성공"
        data:
          type: object
          properties:
            correctRate:
              type: integer
              example: 70
              description: 작성자 추리 정답률 (%, 소수점 반올림)
            correctCount:
              type: integer
              format: int64
              example: 7
              description: 작성자를 맞힌 횟수
            totalGuesses:
              type: integer
              format: int64
              example: 10
              description: 전체 추리 횟수

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 401
        error:
          type: string
          example: "Unauthorized"
        message:
          type: string
          example: "유효하지 않은 토큰입니다."