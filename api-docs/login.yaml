openapi: 3.0.0
info:
  title: 로그인 API 문서
  description: 사용자의 로그인 기능을 제공하는 RESTful API 명세입니다.
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /auth/login:
    post:
      summary: 로그인
      description: 사용자 이메일과 비밀번호를 받아 인증을 수행하고 JWT 토큰 등을 발급합니다.
      tags:
        - Authentication
      requestBody:
        required: true
        description: 로그인할 사용자의 계정 정보
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 잘못된 요청 (필수 값 누락 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ValidationError:
                  summary: 유효성 검사 실패 예시
                  value:
                    status: 400
                    error: "Bad Request"
                    message: "입력값이 올바르지 않습니다."
        '401':
          description: 인증 실패 (존재하지 않는 이메일 또는 비밀번호 불일치)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  summary: 권한 없음 예시
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "이메일 또는 비밀번호가 일치하지 않습니다."

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
          description: 사용자 이메일 (로그인 ID로 사용)
        password:
          type: string
          format: password
          example: "Password123!"
          minLength: 8
          description: 비밀번호 (영문, 숫자, 특수문자 조합 8자리 이상)

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "로그인에 성공하였습니다."
        data:
          type: object
          properties:
            accessToken:
              type: string
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              description: 클라이언트가 인증에 사용할 JWT 액세스 토큰
            refreshToken:
              type: string
              example: "dGhpcy1pcy1hLXJlZnJlc2gtdG9rZW4tc2FtcGxl.."
              description: "액세스 토큰 만료 시 재발급을 위해 사용하는 리프레시 토큰"
            tokenType:
              type: string
              example: "Bearer"
            expiresIn:
              type: integer
              example: 3600
              description: 토큰 유효 시간(초 단위)

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "에러에 대한 상세 메시지"
        details:
          type: array
          description: "유효성 검사 실패"
          items:
            type: object
            properties:
              field:
                type: string
                example: "password"
              reason:
                type: string
                example: "비밀번호는 8자 이상이어야 합니다."