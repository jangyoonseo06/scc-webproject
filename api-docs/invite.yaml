openapi: 3.0.0
info:
  title: 방 참여 API 문서
  description: 방 참여 기능을 제공하는 RESTful API 명세서
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /rooms/join:
    post:
      summary: 방 참여
      description: 초대코드를 기반으로 방에 참여합니다.
      tags:
        - Room
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: 초대 코드, 사용자 ID 입력
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      responses:
        '200':
          description: 방 참여 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinResponse'
        '400':
          description: 초대 코드 불일치 또는 필수 값 누락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ValidationError:
                  summary: 유효성 검사 실패 예시
                  value:
                    status: 400
                    error: "Bad Request"
                    message: "입력값이 올바르지 않습니다"
                    details:
                      - field: "inviteCode"
                        reason: "초대코드가 일치하지 않습니다"
                      - field: "userId"
                        reason: "userId는 필수 값입니다"
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  summary: 접근 권한 없음 예시
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "유효하지 않은 토큰입니다"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    JoinRequest:
      type: object
      required:
        - inviteCode
        - userId
      properties:
        inviteCode:
          type: string
          description: 방 초대 코드
          example: "ABC123"
        userId:
          type: integer
          format: int64
          description: 방에 참여하는 사용자 ID
          example: 1

    JoinResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "방 참여 성공"
        data:
          $ref: '#/components/schemas/JoinData'

    JoinData:
      type: object
      properties:
        roomId:
          type: integer
          format: int64
          description: 참여한 방 ID
          example: 10
        roomName:
          type: string
          description: 참여한 방 이름
          example: "우당탕탕 우리셋"

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "에러에 대한 상세 메시지"
        details:
          type: array
          description: 유효성 검사 실패 상세 목록
          items:
            type: object
            properties:
              field:
                type: string
                example: "inviteCode"
              reason:
                type: string
                example: "초대코드가 일치하지 않습니다"