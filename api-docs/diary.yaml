openapi: 3.0.0
info:
  title: 일기 작성 API 문서
  description: 일기 작성 기능을 제공하는 RESTful API 명세서
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

paths:
  /diaries/write:
    post:
      summary: 일기 작성 및 임시저장
      description: 새로운 일기, 오늘의 감정, 친구에게 할 질문을 작성하거나 임시저장
      tags:
        - Diary
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: 작성할 일기 정보
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiaryRequest'
      responses:
        '201':
          description: 일기 작성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryResponse'
        '400':
          description: 잘못된 요청 (필수 값 누락 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  value:
                    status: 400
                    error: "Bad Request"
                    message: "입력값이 올바르지 않습니다."
                    details:
                      - field : "content"
                        reason : "내용은 필수 입력값입니다."
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  value:
                    status: 401
                    error: "Unauthorized"
                    message: "유효하지 않은 토큰입니다"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DiaryRequest:
      type: object
      required:
        - content
        - questionToFriend
        - date
        - emotion
        - isTemporary
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          example: "오늘의 무엇을 했다"
          description: 오늘의 일기 작성
        questionToFriend:
          type: string
          minLength: 1
          maxLength: 100
          example: "너는 오늘 뭐 했어?"
          description: 친구에게 질문 한마디
        date:
          type: string
          format: date
          example: "2026-10-06"
          description: 일기 날짜 (YYYY-MM-DD)
        emotion:
          type: string
          enum: [HAPPY, CALM, NORMAL, UPSET, TIRED, EXCITED]
          example: "HAPPY"
          description: 오늘의 감정
        isTemporary:
          type: boolean
          example: true
          description: 임시저장 여부 (true 임시저장, false 작성완료)
    
    DiaryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "일기 작성 성공"
        data:
          type: object
          properties:
            DiaryId:
              type: integer
              description: 생성된 일기의 고유 diaryId
              example: 1001

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 401
        error:
          type: string
          example: "Unauthorized"
        message:
          type: string
          example: "인증 실패"
        details:
          type: array
          description: "유효성 검사 실패"
          items:
            type: object
            properties:
              field:
                type: string
                example: "password"
              reason:
                type: string
                example: "비밀번호는 8자 이상이어야 합니다."
          example: "인증 실패"